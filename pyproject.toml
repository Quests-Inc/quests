[project]
name = "quests"
version = "0.1.0"
description = "Game-journal style task manager"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20",
    "alembic>=1.18.5",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.2.2",
]

# The api/llm-action path is pure Go now — the only Python left needs just
# the core deps above (alembic migrations). Everything heavy is opt-in per
# entrypoint so `docker build --target api` doesn't drag in Telegram/STT.
[project.optional-dependencies]
bot = [
    "aiogram>=3.30.0",
    "aiohttp>=3.9",
    "aiohttp-socks>=0.11.0",
]
mcp = [
    "mcp>=2.0.0",
]
pdf = [
    "weasyprint>=62.0",
]
# Standalone STT sidecar (quests-stt) — split out from `bot` because
# faster-whisper drags in ctranslate2/onnxruntime/av (~450MB unpacked), which
# has nothing to do with aiogram and would otherwise redownload on every
# unrelated bot dependency bump.
stt = [
    "aiohttp>=3.9",
    "faster-whisper>=1.2.1",
]

[project.scripts]
quests-migrate = "quests.migrate:main"
quests-telegram = "quests.telegram.main:main"
quests-mcp = "quests.mcp_server:main"
quests-stt = "quests.stt_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quests"]

[tool.hatch.build.targets.wheel.sources]
"src/quests" = "quests"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# alembic/versions is history: never reformat applied migrations.
extend-exclude = ["overlay/_vendor", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Formatting is not enforced (yet) — long lines are tolerated.
ignore = [
    "E501",
    "UP042", # (str, Enum) → StrEnum would change str()/format() of the DB enums
    "UP047", # PEP 695 generics: not worth rewriting working helpers
]

[tool.ruff.lint.per-file-ignores]
# sys.path / env tweaks have to run before the GTK imports.
"overlay/**" = ["E402"]
# the closure runs synchronously inside the iteration that defines it.
"overlay/services/ipc.py" = ["B023"]
"scripts/pipelines/**" = ["B023"]
# `%` formatting keeps the probe output templates readable.
"scripts/security_probe.py" = ["UP031"]

[tool.ruff.lint.isort]
known-first-party = ["quests", "overlay"]
