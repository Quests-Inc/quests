name: CI

# Quote "on": YAML 1.1 treats bare `on` as boolean true; that can leave push
# unregistered while Actions UI still allows manual workflow_dispatch.
"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_api:
        description: Force rebuild/push quests-api
        type: boolean
        default: false
      force_bot:
        description: Force rebuild/push quests-bot
        type: boolean
        default: false
      force_stt:
        description: Force rebuild/push quests-stt
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      frontend: ${{ steps.filter.outputs.frontend }}
      bot: ${{ steps.filter.outputs.bot }}
      stt: ${{ steps.filter.outputs.stt }}
    steps:
      # depth 1 (checkout default) breaks push diffs → filters stay false,
      # so build-* only run via workflow_dispatch force_* inputs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            api:
              - 'go/**'
              - 'frontend/**'
              - 'alembic/**'
              - 'alembic.ini'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'README.md'
              - 'deploy/docker/Dockerfile'
              - 'deploy/docker/docker-bake.hcl'
              - 'deploy/docker/entrypoint-api.sh'
              - 'deploy/docker/nginx.conf'
              - 'deploy/docker/docker-compose.yml'
            bot:
              # Bot image runs telegram + LLM draft only; STT is its own
              # image/container now (see `stt` filter below), shared API
              # code is via HTTP.
              - 'src/quests/telegram/**'
              - 'src/quests/config.py'
              - 'src/quests/envload.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'deploy/docker/Dockerfile'
              - 'deploy/docker/docker-bake.hcl'
              - 'deploy/docker/entrypoint-bot.sh'
            stt:
              - 'src/quests/stt.py'
              - 'src/quests/stt_server.py'
              - 'src/quests/config.py'
              - 'src/quests/envload.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'deploy/docker/Dockerfile'
              - 'deploy/docker/docker-bake.hcl'
              - 'deploy/docker/entrypoint-stt.sh'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v3

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: gofmt + go vet
        run: |
          cd go
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.0
          working-directory: go

      - name: ruff + shellcheck
        run: |
          uv sync --locked --group dev
          just lint-py lint-sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Go build + test
        working-directory: go
        run: |
          go build ./...
          go test ./...

      - name: Sync + pytest
        run: |
          uv sync --locked --group dev --all-extras
          uv run pytest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm test

  # One BuildKit session → api+bot share python-base layer digests on GHCR.
  # Runs in parallel with `test` and pushes only :<sha>; the `promote` job
  # moves :main (the tag the server pulls) once the tests are green, so a red
  # run never changes what a redeploy would fetch.
  build-images:
    needs: [changes]
    if: |
      github.event_name != 'pull_request' &&
      (
        needs.changes.outputs.api == 'true' ||
        needs.changes.outputs.frontend == 'true' ||
        needs.changes.outputs.bot == 'true' ||
        needs.changes.outputs.stt == 'true' ||
        (github.event_name == 'workflow_dispatch' && (inputs.force_api || inputs.force_bot || inputs.force_stt))
      )
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.meta.outputs.targets }}
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Image names + bake targets
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "API_IMAGE=ghcr.io/${owner}/quests-api" >> "$GITHUB_ENV"
          echo "BOT_IMAGE=ghcr.io/${owner}/quests-bot" >> "$GITHUB_ENV"
          echo "STT_IMAGE=ghcr.io/${owner}/quests-stt" >> "$GITHUB_ENV"

          targets=()
          want_api=false
          want_bot=false
          want_stt=false
          if [ "${{ needs.changes.outputs.api }}" = "true" ] \
            || [ "${{ needs.changes.outputs.frontend }}" = "true" ] \
            || { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_api }}" = "true" ]; }; then
            want_api=true
          fi
          if [ "${{ needs.changes.outputs.bot }}" = "true" ] \
            || { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_bot }}" = "true" ]; }; then
            want_bot=true
          fi
          if [ "${{ needs.changes.outputs.stt }}" = "true" ] \
            || { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_stt }}" = "true" ]; }; then
            want_stt=true
          fi

          $want_api && targets+=(api)
          $want_bot && targets+=(bot)
          $want_stt && targets+=(stt)
          if [ ${#targets[@]} -eq 0 ]; then
            echo "No bake targets resolved" >&2
            exit 1
          fi
          # CSV for bake-action
          IFS=,
          echo "targets=${targets[*]}" >> "$GITHUB_OUTPUT"
          echo "Baking: ${targets[*]}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # bake-action has no `vars` input (the old `vars:` block was silently
      # ignored, so TAG stayed "local"); HCL variables come from the environment.
      # API_IMAGE/BOT_IMAGE/STT_IMAGE are already exported via GITHUB_ENV above.
      - uses: docker/bake-action@v6
        env:
          TAG: ${{ github.sha }}
          MAIN_TAG: "false"
        with:
          source: .
          files: deploy/docker/docker-bake.hcl
          targets: ${{ steps.meta.outputs.targets }}
          push: true
          set: |
            *.cache-from=type=gha,scope=quests
            *.cache-to=type=gha,mode=max,scope=quests

  # Points :main (what the server's compose pulls) at the images just built,
  # only after `test` passed. A registry-side retag: no rebuild, seconds.
  # Safe to run on workflow_dispatch from main too (hosted runner, unlike
  # deploy below); never from any other ref.
  promote:
    needs: [build-images, test, lint]
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.build-images.result == 'success' &&
      needs.test.result == 'success' &&
      needs.lint.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag :<sha> as :main
        env:
          TARGETS: ${{ needs.build-images.outputs.targets }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          IFS=',' read -ra targets <<< "$TARGETS"
          for t in "${targets[@]}"; do
            image="ghcr.io/${owner}/quests-${t}"
            docker buildx imagetools create -t "${image}:main" "${image}:${GITHUB_SHA}"
          done

  # Replaces Watchtower's poll-and-swap: an explicit step at the end of a
  # green run on main, instead of the server discovering new images on its
  # own schedule. The SSH key used here is forced (in the server's
  # authorized_keys) to run only deploy/docker/ci-deploy.sh — a leaked key
  # can redeploy from origin/main, nothing else. See docs/deploy-ssh.md.
  #
  # !!! SECURITY — repo is public, runner is self-hosted (lives on the prod
  # box itself, since GitHub-hosted runners can't reach a private LAN IP) !!!
  # A self-hosted runner reachable from a `pull_request`-triggered job on a
  # public repo lets any fork run arbitrary code on it (open a malicious PR,
  # it executes on your box). This job is safe ONLY because it is gated to
  # `push` to `main` — a fork can never produce that event. Keep it that way:
  #   - NEVER add `self-hosted` to `changes` or `test` (they run on PRs)
  #   - NEVER add a `pull_request_target` trigger anywhere in this file
  #   - NEVER loosen this job's `if:` to admit anything but a direct push to
  #     `main` (no `pull_request`, no `workflow_dispatch` from an arbitrary ref)
  # If any of that changes, self-hosted here becomes a real attack surface.
  deploy:
    needs: promote
    # A job with an explicit `if:` stops inheriting the implicit "needs
    # succeeded" gate, so it's spelled out here — otherwise this would also
    # run when promote was skipped (no images built, or tests red).
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.promote.result == 'success'
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      # Runner lives on the target box itself — no SSH hop needed, just run
      # the same script the forced deploy key used to invoke remotely.
      - name: Deploy
        env:
          # Checkout of the repo on the runner host that compose runs from
          # (repo variable QUESTS_DEPLOY_DIR; the old path stays the default).
          DEPLOY_DIR: ${{ vars.QUESTS_DEPLOY_DIR || '/home/amarant/Documents/projects/quests' }}
        run: bash "$DEPLOY_DIR/deploy/docker/ci-deploy.sh"
