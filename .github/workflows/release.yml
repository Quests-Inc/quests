name: Release

# A release is explicit: someone publishes a GitHub Release (tag vMAJOR.MINOR.PATCH) from main.
# Publishing builds and pushes the images with that version and, for a final (not pre-)release, opens a pull
# request in the deploy repository (Quests-Inc/quests-deploy) that sets QUESTS_VERSION; merging it there is what
# doco-cd on the server deploys. Nothing else reaches production.
#
#   gh release create v1.4.0 --target main --generate-notes        (or: just release 1.4.0)
#   gh release create v1.5.0-rc.1 --target main --prerelease …      (images only, no deploy)
#
# Rollback / redeploy: run this workflow by hand (Actions → Release → Run workflow) with an earlier version
# (or simply revert the release commit in the deploy repository): the images already exist. The schema is
# never rolled back: a release is only rollback-able while the data still fits it (docs/postgres.md).
"on":
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release to deploy again, e.g. 1.3.2 (its images must already exist)
        required: true

# One release at a time; a second one waits instead of racing the first for `prod`.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      deploy: ${{ steps.v.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          INPUT: ${{ inputs.version }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            version="${INPUT#v}"
            build=false
          else
            version="${TAG#v}"
            build=true
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$version' is not a SemVer version (MAJOR.MINOR.PATCH[-prerelease])"
            exit 1
          fi
          deploy=true
          if [[ "$version" == *-* ]] || [ "$PRERELEASE" = true ]; then deploy=false; fi
          if [ "$EVENT" = release ]; then
            # Only what is on main can be released.
            git fetch -q origin main
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
              echo "::error::the release tag does not point at a commit of main"
              exit 1
            }
          fi
          {
            echo "version=$version"
            echo "build=$build"
            echo "deploy=$deploy"
          } >> "$GITHUB_OUTPUT"

  checks:
    needs: meta
    if: needs.meta.outputs.build == 'true'
    uses: ./.github/workflows/checks.yml

  images:
    needs: [meta, checks]
    if: needs.meta.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the plan below diffs against the previous release tag
      - name: Image names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "API_IMAGE=ghcr.io/${owner}/quests-api"
            echo "BOT_IMAGE=ghcr.io/${owner}/quests-bot"
          } >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # An image whose inputs did not change since the previous release is not rebuilt: it is re-tagged under the new
      # version (same manifest and layers), so the server pulls nothing for it. Every release still carries a tag for
      # each image, which is what the deploy repository's compose file expects. See deploy/docker/release-plan.sh.
      - name: Plan (build or re-tag)
        id: plan
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          out="$(bash deploy/docker/release-plan.sh "$VERSION" "$GITHUB_SHA")"
          prev="$(sed -n 's/^prev=//p' <<<"$out")"
          unchanged="$(sed -n 's/^unchanged=//p' <<<"$out")"
          targets="api"
          retag=""
          for img in bot; do
            repo_var="${img^^}_IMAGE"
            if [[ " $unchanged " == *" $img "* ]] && docker buildx imagetools inspect "${!repo_var}:${prev}" >/dev/null 2>&1; then
              retag="${retag:+$retag }$img"
            else
              targets="$targets,$img"
            fi
          done
          {
            echo "prev=$prev"
            echo "targets=$targets"
            echo "retag=$retag"
          } >> "$GITHUB_OUTPUT"
          echo "build: $targets; re-tag from ${prev:-none}: ${retag:-nothing}" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: docker/bake-action@v6
        env:
          TAG: ${{ needs.meta.outputs.version }}
          VERSION: ${{ needs.meta.outputs.version }}
        with:
          source: .
          files: deploy/docker/docker-bake.hcl
          targets: ${{ steps.plan.outputs.targets }}
          push: true
          set: |
            *.cache-from=type=gha,scope=quests
            *.cache-to=type=gha,mode=max,scope=quests
      - name: Re-tag unchanged images
        if: steps.plan.outputs.retag != ''
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          PREV: ${{ steps.plan.outputs.prev }}
          RETAG: ${{ steps.plan.outputs.retag }}
        run: |
          set -euo pipefail
          for img in $RETAG; do
            repo_var="${img^^}_IMAGE"
            repo="${!repo_var}"
            docker buildx imagetools create --tag "${repo}:${VERSION}" "${repo}:${PREV}"
            a="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${repo}:${PREV}")"
            b="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${repo}:${VERSION}")"
            if [ "$a" != "$b" ]; then
              echo "::error::${repo}:${VERSION} is $b, expected the digest of ${PREV} ($a)"
              exit 1
            fi
            echo "${repo}:${VERSION} = ${repo}:${PREV} (${a})" | tee -a "$GITHUB_STEP_SUMMARY"
          done

  # Production is not touched from here: the release is announced to the deploy repository as a pull request that
  # sets QUESTS_VERSION. Merging it there is the explicit step that makes doco-cd roll the version out, and
  # reverting it is the rollback. The token below is the only thing this repository holds for that: write access
  # to that one repository (contents + pull requests), nothing on the server.
  deploy:
    needs: [meta, checks, images]
    if: ${{ !cancelled() && needs.meta.outputs.deploy == 'true' && (needs.images.result == 'success' || (needs.meta.outputs.build == 'false' && needs.images.result == 'skipped')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Open the release pull request in the deploy repository
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          GH_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
          DEPLOY_REPO: ${{ vars.DEPLOY_REPO || 'Quests-Inc/quests-deploy' }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::secret DEPLOY_REPO_TOKEN is not set (fine-grained token: Contents + Pull requests write on $DEPLOY_REPO)"
            exit 1
          fi
          git clone -q --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${DEPLOY_REPO}.git" deploy
          cd deploy
          current="$(sed -n 's/^QUESTS_VERSION=//p' version.env 2>/dev/null || true)"
          if [ "$current" = "$VERSION" ]; then
            echo "the deploy repository already runs $VERSION"
            exit 0
          fi
          branch="release/v${VERSION}-${GITHUB_RUN_ID}"
          git switch -q -c "$branch"
          printf 'QUESTS_VERSION=%s\n' "$VERSION" > version.env
          git add version.env
          git -c user.name="quests-release" -c user.email="quests-release@users.noreply.github.com" \
            commit -q -m "release v${VERSION}" -m "source: ${SOURCE}"
          git push -q origin "$branch"
          kind="Release"
          if [ -n "$current" ] && [ "$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | head -1)" = "$VERSION" ]; then kind="Rollback to"; fi
          gh pr create --repo "$DEPLOY_REPO" --base main --head "$branch" \
            --title "${kind} v${VERSION}" \
            --body "Sets \`QUESTS_VERSION\` to ${VERSION} (was: ${current:-none}). Merging makes doco-cd deploy it; the images are already published. Release: ${SOURCE}"
