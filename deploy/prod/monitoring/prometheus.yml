# Prometheus for the Quests stack (quest=345). Scrape targets are compose service names.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: quests
    metrics_path: /metrics
    # The compose command writes $QUESTS_METRICS_TOKEN here before starting prometheus.
    authorization:
      credentials_file: /tmp/metrics_token
    static_configs:
      - targets: ["api:8765"]

  # External view: the API directly, the nginx front door, and the public address through the gateway.
  # An app can only count the errors it served; when it is down (a deploy, a crash) it counts nothing,
  # while these probes keep seeing 502 / timeouts.
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://api:8765/api/ping"]
        labels: {probe: api}
      - targets: ["http://frontend/api/ping"]
        labels: {probe: nginx}
      - targets: ["https://quests.84-38-180-123.sslip.io/api/ping"]
        labels: {probe: public}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
