# Quests — production stack (api + postgres + clamav + frontend; bot + stt under the `bot` profile).
#
# Deployed by doco-cd from the `prod` branch (see deploy/README.md): every release moves that branch to
# a commit that pins QUESTS_VERSION in version.env, so what runs is always one explicit release.
# Settings: config.env (plain), secrets.enc.env (SOPS-encrypted, optional), /legacy.env (the host's old .env,
# optional), version.env (written by the release).
# Locally, for a look at it:  docker compose --env-file version.env --env-file config.env -f docker-compose.yml config

name: quests

x-env: &env
  # Lowest to highest: the host's legacy .env (kept as it was; mounted into doco-cd by bootstrap.sh and absent
  # when there is none), the repository's plain settings, the SOPS-encrypted secrets. A later file wins.
  - path: /legacy.env
    required: false
  - config.env
  - path: secrets.enc.env
    required: false


services:
  api:
    image: ${QUESTS_IMAGE_REPO:-ghcr.io/valirum}/quests-api:${QUESTS_VERSION:?version.env is missing, deploy through a release}
    container_name: quests-api
    restart: unless-stopped
    env_file: *env
    environment:
      QUESTS_ROOT: /app
      QUESTS_DATA_DIR: /app/data
      QUESTS_HOST: "0.0.0.0"
      QUESTS_PORT: "8765"
      QUESTS_RELOAD: "0"
      # Accounts: "auto" enforces auth as soon as an account exists. Create the
      # first one with:
      #   docker compose exec api quests-server useradd <username>
      # The rest (QUESTS_AUTH, QUESTS_SECURE_COOKIES, QUESTS_METRICS_TOKEN, WebDAV, LLM keys…) comes
      # from config.env and secrets.enc.env above.
      # Action-batch assistant (text -> Groq -> quest actions) is in-process
      # Go now — api itself needs Groq egress, hence extra_hosts below.
      # bridge network can't reach 127.0.0.1:12334 on the host directly —
      # host.docker.internal (via extra_hosts) is the bridge-safe way in.
      QUESTS_LLM_PROXY: ${QUESTS_LLM_PROXY:-http://host.docker.internal:12334}
      # Attachments: bytes live on the already-running WebDAV (QUESTS_WEBDAV_* in the env files).
      # clamd is the sidecar below; uploads 503 until it is ready.
      QUESTS_CLAMAV_ADDR: ${QUESTS_CLAMAV_ADDR:-clamav:3310}
      # PostgreSQL below; the server migrates the schema itself when it starts.
      # The URL is built from these and POSTGRES_PASSWORD (from the env files): no secret passes through ${…}.
      QUESTS_DB_HOST: postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - quests-data:/app/data
    ports:
      - "${QUESTS_PUBLISH_PORT:-8765}:8765"
    healthcheck:
      # /api/ping, not /api/health: health is behind auth once accounts exist,
      # and an unauthenticated probe would pin the container to "unhealthy".
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/api/ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_started

  postgres:
    image: postgres:17-bookworm
    container_name: quests-postgres
    restart: unless-stopped
    # POSTGRES_PASSWORD comes from the env files (the other variables in them are not used by postgres).
    env_file: *env
    environment:
      POSTGRES_USER: quests
      POSTGRES_DB: quests
    volumes:
      - quests-pg:/var/lib/postgresql/data
    # No published port: api reaches it on the compose network as postgres:5432.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quests -d quests"]
      interval: 5s
      timeout: 3s
      retries: 12

  # clamd INSTREAM sidecar. Signatures live in a volume so freshclam does not
  # re-download the full database on every restart. First boot takes a while;
  # uploads 503 until clamd answers, which is the designed "unknown ≠ clean".
  clamav:
    image: clamav/clamav-debian:1.4
    container_name: quests-clamav
    restart: unless-stopped
    volumes:
      - clamav-sigs:/var/lib/clamav
    # No published port: api talks to it on the compose network as clamav:3310.

  # Voice-to-text sidecar (faster-whisper). Split out of bot so the
  # ctranslate2/onnxruntime/av stack (~450MB unpacked) only rebuilds when STT
  # itself changes. bot is network_mode: host (see below) so it can't resolve
  # this by compose service name — reaches it via 127.0.0.1, same as api.
  # Loopback-only publish: nothing outside this host has business calling it.
  stt:
    # Optional personal-client stack (profile "bot"): not part of the multi-user platform, see docs/telegram-bot.md.
    # Enabled by `profiles: [bot]` in .doco-cd.yml.
    profiles: ["bot"]
    image: ${QUESTS_IMAGE_REPO:-ghcr.io/valirum}/quests-stt:${QUESTS_VERSION:?version.env is missing, deploy through a release}
    container_name: quests-stt
    restart: unless-stopped
    env_file: *env
    environment:
      QUESTS_ROOT: /app
      QUESTS_DATA_DIR: /app/data
      # QUESTS_WHISPER_* from config.env: small|medium|large — app default small
    volumes:
      - quests-data:/app/data
    ports:
      - "127.0.0.1:${QUESTS_STT_PORT:-8766}:8766"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8766/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      # Whisper model download + load on first request can take a while on a
      # cold volume — the healthcheck should not flap the container over it.
      start_period: 60s

  # host network: proxy on 127.0.0.1:12334 is reachable (bridge → host.docker.internal is not)
  bot:
    profiles: ["bot"]
    image: ${QUESTS_IMAGE_REPO:-ghcr.io/valirum}/quests-bot:${QUESTS_VERSION:?version.env is missing, deploy through a release}
    container_name: quests-bot
    restart: unless-stopped
    network_mode: host
    depends_on:
      api:
        condition: service_healthy
      stt:
        condition: service_healthy
    env_file: *env
    environment:
      QUESTS_ROOT: /app
      QUESTS_DATA_DIR: /app/data
      QUESTS_API: http://127.0.0.1:${QUESTS_PUBLISH_PORT:-8765}
      QUESTS_STT: http://127.0.0.1:${QUESTS_STT_PORT:-8766}
      # Mint with: docker compose exec api quests-server token add telegram
      # (QUESTS_API_TOKEN, QUESTS_TG_TOKEN… come from secrets.enc.env)
      QUESTS_TG_PROXY: ${QUESTS_TG_PROXY:-http://127.0.0.1:12334}
    volumes:
      - quests-data:/app/data

  # Nginx front door: SPA + /api + /ws → api
  frontend:
    image: nginx:1.27-alpine
    container_name: quests-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${QUESTS_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  quests-data:
  quests-pg:
  clamav-sigs:
