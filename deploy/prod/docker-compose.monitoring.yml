# Monitoring stack (quest=345): Uptime Kuma (probes, uptime graph, alerts), Prometheus, Grafana and
# exporters. Part of the production deployment: `.doco-cd.yml` lists this file next to docker-compose.yml
# (remove it from `compose_files` there to switch monitoring off).
#
# First start: open http://<host>:${KUMA_PORT:-3001}, create the admin account, then
# `monitoring/kuma-monitors.py` adds the probes (docs/monitoring.md).

services:
  kuma:
    image: louislam/uptime-kuma:1
    container_name: quests-kuma
    restart: unless-stopped
    volumes:
      - kuma-data:/app/data
    ports:
      - "${KUMA_PORT:-3001}:3001"
    # Same compose network as the stack: probes address services by name (api, frontend, postgres, clamav).
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3001/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s


  # --- metrics (quest=345): Prometheus scrapes the API's /metrics (bearer QUESTS_METRICS_TOKEN),
  # the host (node-exporter) and Postgres; Grafana draws them. Needs QUESTS_METRICS_TOKEN and
  # GRAFANA_ADMIN_PASSWORD in secrets.enc.env; Prometheus and the exporters publish no ports.
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: quests-prometheus
    restart: unless-stopped
    environment:
      QUESTS_METRICS_TOKEN: ${QUESTS_METRICS_TOKEN:?set QUESTS_METRICS_TOKEN in secrets.enc.env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        printf '%s' "$$QUESTS_METRICS_TOKEN" > /tmp/metrics_token &&
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-90d}
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: quests-blackbox
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: quests-node-exporter
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)
    volumes:
      - /:/host:ro,rslave

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: quests-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://quests:${POSTGRES_PASSWORD:-}@postgres:5432/quests?sslmode=disable

  grafana:
    image: grafana/grafana:11.3.0
    container_name: quests-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in secrets.enc.env}
      # Public address when Grafana sits behind the gateway (redirects and links are built from it).
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000/}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    depends_on:
      - prometheus

volumes:
  kuma-data:
  prometheus-data:
  grafana-data:
