server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. `api` is resolved per request through the variable below, not once at
    # start: the api container gets a new IP whenever it is recreated (every deploy), and a name
    # resolved only at start left this front door on 502 until nginx itself was restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8765;

    # Everything (SPA, /api, /ws) is served by the API container.
    location / {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
