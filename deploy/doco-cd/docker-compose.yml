# doco-cd: the agent that deploys production. It polls the `prod` branch of the repository (outgoing
# connections only: the server needs no public address) and runs `docker compose up -d` for what it finds
# there. Started by bootstrap.sh; after that it needs nobody.
#
# Inputs (written by bootstrap.sh into $DEPLOY_STATE, default /srv/quests-deploy):
#   notify.env                (only with Telegram settings) APPRISE_* for notifications
#   .env                      DEPLOY_REPO_URL, DEPLOY_STATE and, optionally, the notification settings
#   secrets/git_access_token  a read-only token for the repository
#   secrets/sops_age_key      the age PRIVATE key that opens secrets.enc.env
#   docker-config/config.json registry login (read:packages) for pulling the private images
name: doco-cd

services:
  doco-cd:
    image: ghcr.io/kimdre/doco-cd:${DOCO_CD_VERSION:-latest}
    container_name: doco-cd
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Moscow}
      POLL_CONFIG: |
        - url: ${DEPLOY_REPO_URL:?run bootstrap.sh}
          reference: ${DEPLOY_REF:-prod}
          interval: ${DEPLOY_POLL_SECONDS:-60}
      GIT_ACCESS_TOKEN_FILE: /run/secrets/git_access_token
      SOPS_AGE_KEY_FILE: /run/secrets/sops_age_key
      # Registry credentials for the images (docker config.json mounted below).
      DOCKER_CONFIG: /docker-config
    # Notifications (APPRISE_*) exist only when bootstrap.sh was given a Telegram token: it then writes this file.
    env_file:
      - path: ${DEPLOY_STATE:-/srv/quests-deploy}/notify.env
        required: false
    secrets:
      - git_access_token
      - sops_age_key
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - doco-cd-data:/data
      - ${DEPLOY_STATE:-/srv/quests-deploy}/docker-config:/docker-config:ro

  # Delivers doco-cd's messages to Telegram: `COMPOSE_PROFILES=notify` (bootstrap.sh sets it when a bot
  # token and chat id are provided). Without a token nothing is sent and this container does not exist.
  apprise:
    profiles: ["notify"]
    image: caronc/apprise:latest
    container_name: doco-cd-apprise
    restart: unless-stopped
    expose:
      - "8000"

secrets:
  git_access_token:
    file: ${DEPLOY_STATE:-/srv/quests-deploy}/secrets/git_access_token
  sops_age_key:
    file: ${DEPLOY_STATE:-/srv/quests-deploy}/secrets/sops_age_key

volumes:
  doco-cd-data:
