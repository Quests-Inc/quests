# Prometheus for the Quests stack (quest=345). Scrape targets are compose service names.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: quests
    metrics_path: /metrics
    # The compose command writes $QUESTS_METRICS_TOKEN here before starting prometheus.
    authorization:
      credentials_file: /tmp/metrics_token
    static_configs:
      - targets: ["api:8765"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
