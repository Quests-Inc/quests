# Quests — Docker Compose (server: api + bot + stt + frontend)
#
#   cd /path/to/Quests
#   cp .env.example .env   # POSTGRES_PASSWORD (required), TG_* ; QUESTS_*_IMAGE for GHCR
#
# Важно: -f deploy/docker/... сам по себе НЕ читает корневой .env для
# подстановки ${QUESTS_API_IMAGE}. Всегда передавай --env-file:
#
#   docker compose --env-file .env -f deploy/docker/docker-compose.yml up -d --build
#   docker compose --env-file .env -f deploy/docker/docker-compose.yml pull
#
# HUD: not in Docker — `just run-overlay` + quests-overlay.service

name: quests

services:
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: api
    image: ${QUESTS_API_IMAGE:-quests-api:local}
    container_name: quests-api
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: false
    environment:
      QUESTS_ROOT: /app
      QUESTS_DATA_DIR: /app/data
      QUESTS_HOST: "0.0.0.0"
      QUESTS_PORT: "8765"
      QUESTS_RELOAD: "0"
      # Accounts: "auto" enforces auth as soon as an account exists. Create the
      # first one with:
      #   docker compose exec api quests-server useradd <username>
      QUESTS_AUTH: ${QUESTS_AUTH:-auto}
      # Bearer token for GET /metrics (Prometheus, docs/monitoring.md); empty = endpoint off.
      QUESTS_METRICS_TOKEN: ${QUESTS_METRICS_TOKEN:-}
      # Set to 1 when this instance is served over HTTPS (marks the session
      # cookie Secure). Leave 0 for plain http, or the browser drops the cookie.
      QUESTS_SECURE_COOKIES: ${QUESTS_SECURE_COOKIES:-0}
      # Action-batch assistant (text -> Groq -> quest actions) is in-process
      # Go now — api itself needs Groq egress, hence extra_hosts below.
      # bridge network can't reach 127.0.0.1:12334 on the host directly —
      # host.docker.internal (via extra_hosts) is the bridge-safe way in.
      QUESTS_LLM_PROXY: ${QUESTS_LLM_PROXY:-http://host.docker.internal:12334}
      # Attachments: bytes live on the already-running WebDAV, not in this
      # compose. clamd is the sidecar below; uploads 503 until it is ready.
      QUESTS_WEBDAV_URL: ${QUESTS_WEBDAV_URL:-}
      QUESTS_WEBDAV_USER: ${QUESTS_WEBDAV_USER:-}
      QUESTS_WEBDAV_PASS: ${QUESTS_WEBDAV_PASS:-}
      QUESTS_CLAMAV_ADDR: ${QUESTS_CLAMAV_ADDR:-clamav:3310}
      # PostgreSQL below; the entrypoint migrates the schema before the server starts.
      QUESTS_DATABASE_URL: postgresql://quests:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/quests
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - quests-data:/app/data
    ports:
      - "${QUESTS_PUBLISH_PORT:-8765}:8765"
    healthcheck:
      # /api/ping, not /api/health: health is behind auth once accounts exist,
      # and an unauthenticated probe would pin the container to "unhealthy".
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/api/ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_started

  postgres:
    image: postgres:17-bookworm
    container_name: quests-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: quests
      POSTGRES_DB: quests
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - quests-pg:/var/lib/postgresql/data
    # No published port: api reaches it on the compose network as postgres:5432.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quests -d quests"]
      interval: 5s
      timeout: 3s
      retries: 12

  # clamd INSTREAM sidecar. Signatures live in a volume so freshclam does not
  # re-download the full database on every restart. First boot takes a while;
  # uploads 503 until clamd answers, which is the designed "unknown ≠ clean".
  clamav:
    image: clamav/clamav-debian:1.4
    container_name: quests-clamav
    restart: unless-stopped
    volumes:
      - clamav-sigs:/var/lib/clamav
    # No published port: api talks to it on the compose network as clamav:3310.

  # Voice-to-text sidecar (faster-whisper). Split out of bot so the
  # ctranslate2/onnxruntime/av stack (~450MB unpacked) only rebuilds when STT
  # itself changes. bot is network_mode: host (see below) so it can't resolve
  # this by compose service name — reaches it via 127.0.0.1, same as api.
  # Loopback-only publish: nothing outside this host has business calling it.
  stt:
    # Optional personal-client stack (profile "bot"): not part of the multi-user platform, see docs/telegram-bot.md.
    # Enable with COMPOSE_PROFILES=bot in .env (the prod host has it).
    profiles: ["bot"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: stt
    image: ${QUESTS_STT_IMAGE:-quests-stt:local}
    container_name: quests-stt
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: false
    environment:
      QUESTS_ROOT: /app
      QUESTS_DATA_DIR: /app/data
      # QUESTS_WHISPER_* from env_file (.env): small|medium|large — app default small
    volumes:
      - quests-data:/app/data
    ports:
      - "127.0.0.1:${QUESTS_STT_PORT:-8766}:8766"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8766/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      # Whisper model download + load on first request can take a while on a
      # cold volume — the healthcheck should not flap the container over it.
      start_period: 60s

  # host network: proxy on 127.0.0.1:12334 is reachable (bridge → host.docker.internal is not)
  bot:
    profiles: ["bot"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: bot
    image: ${QUESTS_BOT_IMAGE:-quests-bot:local}
    container_name: quests-bot
    restart: unless-stopped
    network_mode: host
    depends_on:
      api:
        condition: service_healthy
      stt:
        condition: service_healthy
    env_file:
      - path: ../../.env
        required: false
    environment:
      QUESTS_ROOT: /app
      QUESTS_DATA_DIR: /app/data
      QUESTS_API: http://127.0.0.1:${QUESTS_PUBLISH_PORT:-8765}
      QUESTS_STT: http://127.0.0.1:${QUESTS_STT_PORT:-8766}
      # Mint with: docker compose exec api quests-server token add telegram
      QUESTS_API_TOKEN: ${QUESTS_API_TOKEN:-}
      QUESTS_TG_PROXY: ${QUESTS_TG_PROXY:-http://127.0.0.1:12334}
    volumes:
      - quests-data:/app/data

  # Nginx front door: SPA + /api + /ws → api
  frontend:
    image: nginx:1.27-alpine
    container_name: quests-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${QUESTS_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  quests-data:
  quests-pg:
  clamav-sigs:
