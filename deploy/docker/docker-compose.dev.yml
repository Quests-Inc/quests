# Local API only — no bot / nginx / clamav.
# Host data + frontend/dist are bind-mounted so SPA rebuilds don't need an image rebuild.
#
#   ./scripts/dev-api-docker.sh
#   ./scripts/dev-api-docker.sh --rebuild   # after Go/Python/Dockerfile changes
#
# network_mode: host + 127.0.0.1 so QUESTS_AUTH=off is allowed (0.0.0.0 refuses
# unauthenticated binds).
name: quests-dev

services:
  # Local PostgreSQL for the dev API (and for `just run-server` etc.): 127.0.0.1:55433, user/password/db quests.
  postgres:
    image: postgres:17-bookworm
    container_name: quests-pg-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: quests
      POSTGRES_PASSWORD: quests
      POSTGRES_DB: quests
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - quests-dev-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quests -d quests"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: api
    image: quests-api:local
    container_name: quests-api-dev
    restart: unless-stopped
    network_mode: host
    environment:
      QUESTS_ROOT: /app
      QUESTS_DATA_DIR: /app/data
      QUESTS_HOST: "127.0.0.1"
      QUESTS_PORT: "8765"
      QUESTS_AUTH: "off"
      QUESTS_SECURE_COOKIES: "0"
      QUESTS_CLAMAV_ADDR: ""
      QUESTS_WEBDAV_URL: ""
      QUESTS_DATABASE_URL: postgresql://quests:quests@127.0.0.1:55433/quests?sslmode=disable
      TZ: Europe/Moscow
      QUESTS_TZ: Europe/Moscow
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.dev
    volumes:
      - ../../data:/app/data
      - ../../frontend/dist:/app/frontend/dist:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/api/ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 25s

volumes:
  quests-dev-pg:
