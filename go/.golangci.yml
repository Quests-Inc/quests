version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  settings:
    errcheck:
      # Best-effort cleanup: nothing useful can be done with these errors.
      exclude-functions:
        - (io.Closer).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        - (*os.File).Close
        - (io.ReadCloser).Close
        - os.Remove
        - os.RemoveAll
        - (io.Writer).Write
        - (*net.TCPConn).Close
  exclusions:
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
