# TypeScript types of the HTTP API, generated from the Go structs: `just gen-types`
# (frontend/src/lib/api/*.gen.ts; CI fails when they are stale).
packages:
  - path: "github.com/valirum/quests/go/internal/domain"
    output_path: "../frontend/src/lib/api/domain.gen.ts"
    type_mappings:
      time.Time: "string"
  - path: "github.com/valirum/quests/go/internal/identity"
    output_path: "../frontend/src/lib/api/identity.gen.ts"
    include_files:
      - "workspaces.go"
      - "invites.go"
    type_mappings:
      time.Time: "string"
      time.Duration: "number"
  - path: "github.com/valirum/quests/go/internal/store"
    output_path: "../frontend/src/lib/api/store.gen.ts"
    exclude_files:
      - "store.go"
      - "wsdata.go"
      - "durations.go"
    type_mappings:
      time.Time: "string"
      time.Duration: "number"
      json.RawMessage: "unknown"
  - path: "github.com/valirum/quests/go/internal/httpapi"
    output_path: "../frontend/src/lib/api/http.gen.ts"
    include_files:
      - "runner.go"
      - "llm_settings.go"
      - "notes.go"
      - "notecheck.go"
      - "attachments.go"
      - "graphdraft.go"
      - "workspaces.go"
    frontmatter: |
      import type { ResolvedRef } from "./domain.gen";
      import type { AttachmentRead, DraftOp, NoteBriefRead, NotePopularity, NoteRead, Runner, RevisionRead } from "./store.gen";
      import type { Workspace } from "./identity.gen";
      import type { Provider } from "./llm.gen";
    type_mappings:
      time.Time: "string"
      time.Duration: "number"
      json.RawMessage: "unknown"
      llmassist.Provider: "Provider"
      store.Runner: "Runner"
      store.AttachmentRead: "AttachmentRead"
      store.DraftOp: "DraftOp"
      identity.Workspace: "Workspace"
      store.RevisionRead: "RevisionRead"
      store.NoteRead: "NoteRead"
      store.NoteBriefRead: "NoteBriefRead"
      store.NotePopularity: "NotePopularity"
      domain.ResolvedRef: "ResolvedRef"
  - path: "github.com/valirum/quests/go/internal/llmassist"
    output_path: "../frontend/src/lib/api/llm.gen.ts"
    include_files:
      - "provider.go"
