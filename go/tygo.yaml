# TypeScript types of the HTTP API, generated from the Go structs: `just gen-types`
# (frontend/src/shared/api/*.gen.ts; CI fails when they are stale).
packages:
  - path: "github.com/quests-inc/quests/go/internal/journal"
    output_path: "../frontend/src/shared/api/journal.gen.ts"
    frontmatter: |
      import type { Resolved } from "./refs.gen";
    type_mappings:
      time.Time: "string"
      refs.Resolved: "Resolved"
  - path: "github.com/quests-inc/quests/go/internal/identity"
    output_path: "../frontend/src/shared/api/identity.gen.ts"
    include_files:
      - "workspaces.go"
      - "invites.go"
    type_mappings:
      time.Time: "string"
      time.Duration: "number"
  - path: "github.com/quests-inc/quests/go/internal/identity/http"
    output_path: "../frontend/src/shared/api/identity_http.gen.ts"
    include_files:
      - "views.go"
    frontmatter: |
      import type { Workspace } from "./identity.gen";
    type_mappings:
      time.Time: "string"
      time.Duration: "number"
      identity.Workspace: "Workspace"
  - path: "github.com/quests-inc/quests/go/internal/refs"
    output_path: "../frontend/src/shared/api/refs.gen.ts"
    include_files:
      - "resolved.go"
    type_mappings:
      time.Time: "string"
  - path: "github.com/quests-inc/quests/go/internal/knowledge/http"
    output_path: "../frontend/src/shared/api/knowledge_http.gen.ts"
    include_files:
      - "views.go"
    frontmatter: |
      import type { AttachmentRead, NoteBriefRead, NotePopularity, NoteRead, RevisionRead } from "./knowledge.gen";
      import type { Resolved } from "./refs.gen";
    type_mappings:
      time.Time: "string"
      knowledge.NoteRead: "NoteRead"
      knowledge.AttachmentRead: "AttachmentRead"
      knowledge.RevisionRead: "RevisionRead"
      knowledge.NoteBriefRead: "NoteBriefRead"
      knowledge.NotePopularity: "NotePopularity"
      refs.Resolved: "Resolved"
  - path: "github.com/quests-inc/quests/go/internal/knowledge"
    output_path: "../frontend/src/shared/api/knowledge.gen.ts"
    exclude_files:
      - "store.go"
      - "durations.go"
      - "emit_data.go"
    type_mappings:
      time.Time: "string"
      time.Duration: "number"
      json.RawMessage: "unknown"
  - path: "github.com/quests-inc/quests/go/internal/automation"
    output_path: "../frontend/src/shared/api/automation.gen.ts"
    exclude_files:
      - "store.go"
      - "durations.go"
      - "emit_data.go"
    type_mappings:
      time.Time: "string"
      time.Duration: "number"
      json.RawMessage: "unknown"
      journal.Tag: "Tag"
    frontmatter: |
      import type { Tag } from "./journal.gen";
  - path: "github.com/quests-inc/quests/go/internal/store"
    output_path: "../frontend/src/shared/api/store.gen.ts"
    exclude_files:
      - "store.go"
      - "wsdata.go"
      - "durations.go"
      - "emit_data.go"
    type_mappings:
      time.Time: "string"
      time.Duration: "number"
      json.RawMessage: "unknown"
  - path: "github.com/quests-inc/quests/go/internal/assistant"
    output_path: "../frontend/src/shared/api/assistant.gen.ts"
    include_files:
      - "views.go"
    frontmatter: |
      import type { Provider } from "./llm.gen";
    type_mappings:
      time.Time: "string"
      time.Duration: "number"
      json.RawMessage: "unknown"
      llmassist.Provider: "Provider"
      knowledge.AttachmentRead: "AttachmentRead"
      store.DraftOp: "DraftOp"
      knowledge.RevisionRead: "RevisionRead"
  - path: "github.com/quests-inc/quests/go/internal/automation/http"
    output_path: "../frontend/src/shared/api/automation_http.gen.ts"
    include_files:
      - "views.go"
    frontmatter: |
      import type { Runner } from "./automation.gen";
    type_mappings:
      time.Time: "string"
      time.Duration: "number"
      json.RawMessage: "unknown"
      automation.Runner: "Runner"
  - path: "github.com/quests-inc/quests/go/internal/graphdraft"
    output_path: "../frontend/src/shared/api/graphdraft.gen.ts"
    include_files:
      - "views.go"
    frontmatter: |
      import type { DraftOp } from "./store.gen";
    type_mappings:
      json.RawMessage: "unknown"
      store.DraftOp: "DraftOp"
  - path: "github.com/quests-inc/quests/go/internal/llmassist"
    output_path: "../frontend/src/shared/api/llm.gen.ts"
    include_files:
      - "provider.go"
